<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGL 2026 Rapid Revision — English + GA</title>
<style>
  :root{
    --bg:#0b1220; --card:#111c33; --card2:#0e1830; --line:#22304f;
    --txt:#e8eefc; --mut:#93a3c4; --acc:#f5a623; --acc2:#ffd97a;
    --ok:#10b981; --okbg:rgba(16,185,129,.14); --bad:#ef4444; --badbg:rgba(239,68,68,.13);
    --chip:#16223e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(1200px 600px at 50% -10%,#16264a 0%,var(--bg) 55%) fixed,var(--bg);
    color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;justify-content:center;padding:18px 14px 60px}
  .app{width:100%;max-width:640px}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,var(--acc),#e2641d);box-shadow:0 6px 18px rgba(245,166,35,.35)}
  .brand h1{font-size:17px;letter-spacing:.3px}
  .brand h1 span{color:var(--acc2)}
  .brand small{display:block;color:var(--mut);font-size:11.5px;font-weight:400;letter-spacing:.4px}
  .streak{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
    font-size:13.5px;font-weight:700;white-space:nowrap}
  .chips{display:flex;gap:8px;margin-bottom:12px}
  .chip{flex:1;text-align:center;padding:10px 6px;border-radius:12px;background:var(--chip);
    border:1px solid var(--line);color:var(--mut);font-size:13.5px;font-weight:600;cursor:pointer;transition:.18s}
  .chip.on{background:linear-gradient(135deg,rgba(245,166,35,.22),rgba(245,166,35,.08));
    border-color:var(--acc);color:var(--acc2)}
  .stats{display:flex;gap:8px;margin-bottom:14px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
  .stat b{display:block;font-size:17px}
  .stat span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
    border-radius:18px;padding:20px 18px;box-shadow:0 18px 44px rgba(0,0,0,.45);animation:rise .25s ease}
  @keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
  .meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    padding:5px 10px;border-radius:999px}
  .tag.eng{background:rgba(96,165,250,.15);color:#93c5fd;border:1px solid rgba(96,165,250,.4)}
  .tag.ga{background:rgba(245,166,35,.14);color:var(--acc2);border:1px solid rgba(245,166,35,.4)}
  .tag.topic{background:rgba(148,163,184,.12);color:var(--mut);border:1px solid var(--line)}
  .qno{margin-left:auto;color:var(--mut);font-size:12px;font-weight:600}
  .q{font-size:17.5px;line-height:1.55;font-weight:600;margin-bottom:16px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;cursor:pointer;
    background:#0d1730;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;
    color:var(--txt);font-size:15px;line-height:1.45;transition:transform .12s,border-color .12s,background .12s}
  .opt:not(.lock):hover{border-color:#3b517f;transform:translateY(-1px)}
  .opt:not(.lock):active{transform:scale(.99)}
  .opt .k{flex:0 0 28px;height:28px;border-radius:9px;display:grid;place-items:center;
    background:#1a2748;color:var(--mut);font-weight:800;font-size:13px}
  .opt.lock{cursor:default}
  .opt.right{background:var(--okbg);border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 8px 22px rgba(16,185,129,.25)}
  .opt.right .k{background:var(--ok);color:#04120c}
  .opt.wrong{background:var(--badbg);border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
  .opt.wrong .k{background:var(--bad);color:#1c0505}
  .opt.dim{opacity:.55}
  .why{margin-top:14px;background:#0d1730;border:1px dashed #33507e;border-left:4px solid var(--acc);
    border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;color:#cdd9f2;display:none}
  .why.show{display:block;animation:rise .25s ease}
  .why b{color:var(--acc2)}
  .row{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:none;border-radius:13px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;transition:.15s}
  .btn.next{background:linear-gradient(135deg,var(--acc),#e2641d);color:#241100;display:none}
  .btn.next.show{display:block}
  .btn.next:active{transform:scale(.98)}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--mut);flex:0 0 110px}
  .btn.ghost:active{transform:scale(.97)}
  .foot{margin-top:16px;text-align:center;color:var(--mut);font-size:12px;line-height:1.7}
  .foot b{color:var(--acc2)}
  kbd{background:#1a2748;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11.5px;font-family:inherit}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#13203c;border:1px solid var(--acc);color:var(--acc2);padding:11px 20px;border-radius:999px;
    font-size:14px;font-weight:700;transition:.3s;pointer-events:none;white-space:nowrap;z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media(max-width:420px){.q{font-size:16px}.opt{font-size:14px;padding:12px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">⚡</div>
      <h1>CGL 2026 <span>Rapid Revision</span><small>ENGLISH + GENERAL AWARENESS • EXAM-LEVEL</small></h1>
    </div>
    <div class="streak" id="streak">🔥 0</div>
  </header>

  <div class="chips">
    <div class="chip on" data-f="all">All Subjects</div>
    <div class="chip" data-f="e">English</div>
    <div class="chip" data-f="g">General Awareness</div>
  </div>

  <div class="stats">
    <div class="stat"><b id="sAtt">0</b><span>Attempted</span></div>
    <div class="stat"><b id="sOk" style="color:var(--ok)">0</b><span>Correct</span></div>
    <div class="stat"><b id="sAcc">–</b><span>Accuracy</span></div>
    <div class="stat"><b id="sBank">0</b><span>In Bank</span></div>
  </div>

  <main class="card" id="card">
    <div class="meta">
      <span class="tag eng" id="tSub">ENGLISH</span>
      <span class="tag topic" id="tTop">Synonym</span>
      <span class="qno" id="tQno">Q 1</span>
    </div>
    <div class="q" id="qText"></div>
    <div class="opts" id="opts"></div>
    <div class="why" id="why"></div>
    <div class="row">
      <button class="btn ghost" id="btnSkip">Skip ⏭</button>
      <button class="btn next" id="btnNext">Next Question →</button>
    </div>
  </main>

  <div class="foot">
    Tap an option — the correct answer lights up <b>instantly</b>, like a feed quiz.<br>
    Keys: <kbd>1</kbd>–<kbd>4</kbd> answer • <kbd>Enter</kbd> next • <kbd>S</kbd> skip &nbsp;•&nbsp; <b id="bankNote"></b>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ QUESTION BANK (authored for SSC CGL 2026 Tier-1 level) ============
   s: e=English, g=General Awareness | t: topic | q: question | o: options | a: answer idx | x: explanation */
const QUESTIONS = [
{s:"e",t:"err",q:"Find the error: “Neither of the two brothers (a)/ have completed (b)/ their project on time (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Neither of” takes a singular verb — <b>has completed</b>, not have."},
{s:"e",t:"err",q:"Find the error: “He has been working (a)/ in this office (b)/ since five years (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:2,x:"<b>For five years</b> — “since” is for a point of time, “for” for a duration."},
{s:"e",t:"err",q:"Find the error: “Each of the students (a)/ were given (b)/ a separate topic (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Each of” is singular — <b>was given</b>."},
{s:"e",t:"err",q:"Find the error: “Not only the teacher (a)/ but also the students (b)/ was surprised at the result (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:2,x:"With “not only…but also”, the verb agrees with the nearer subject — <b>were surprised</b>."},
{s:"e",t:"err",q:"Find the error: “Scarcely had he reached (a)/ the station than (b)/ the train left (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Scarcely…<b>when</b>” is the correct pair, not “than”."},
{s:"e",t:"err",q:"Find the error: “One of the boys (a)/ who are participating (b)/ is my brother (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:3,x:"No error — “who” refers to “boys” (plural → are), main verb “is” agrees with “one”."},
{s:"e",t:"err",q:"Find the error: “If I was you (a)/ I would not (b)/ accept the offer (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:0,x:"Imaginary condition needs <b>were</b> — “If I were you”."},
{s:"e",t:"err",q:"Find the error: “The committee (a)/ have submitted (b)/ its final report (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"Committee acting as one body takes a singular verb — <b>has submitted</b>."},
{s:"e",t:"err",q:"Find the error: “She is junior (a)/ than me (b)/ in this department (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Junior” takes <b>to</b>, not “than” — junior to me."},
{s:"e",t:"err",q:"Find the error: “He prevented me (a)/ to go (b)/ to the market (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Prevent” takes <b>from + -ing</b> — prevented me from going."},
{s:"e",t:"err",q:"Find the error: “The sceneries of Kashmir (a)/ are (b)/ breathtaking (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:0,x:"“Scenery” is uncountable — <b>The scenery</b> of Kashmir is breathtaking."},
{s:"e",t:"err",q:"Find the error: “I am looking forward (a)/ to meet (b)/ you soon (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Look forward to” takes a gerund — <b>to meeting</b> you."},
{s:"e",t:"err",q:"Find the error: “Between you and I (a)/ the secret (b)/ must be kept (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:0,x:"After a preposition use the objective case — <b>between you and me</b>."},
{s:"e",t:"err",q:"Find the error: “He is the most tallest (a)/ boy (b)/ in the class (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:0,x:"Double superlative — just <b>the tallest</b>."},
{s:"e",t:"err",q:"Find the error: “No sooner did he enter (a)/ the room when (b)/ the lights went off (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“No sooner…<b>than</b>” is the correct pair."},
{s:"e",t:"err",q:"Find the error: “The teacher asked (a)/ the students that (b)/ why they were late (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"Remove “that” in indirect questions — asked the students <b>why</b> they were late."},
{s:"e",t:"err",q:"Find the error: “My friend has (a)/ many informations (b)/ about the exam (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Information” is uncountable — <b>much information</b>."},
{s:"e",t:"err",q:"Find the error: “Hardly he had finished (a)/ his lunch (b)/ when the bell rang (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:0,x:"Inversion needed — <b>Hardly had he</b> finished."},
{s:"e",t:"err",q:"Find the error: “She prefers coffee (a)/ than (b)/ tea (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Prefer” takes <b>to</b> — prefers coffee to tea."},
{s:"e",t:"err",q:"Find the error: “The furnitures in the room (a)/ were (b)/ very expensive (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:0,x:"“Furniture” is uncountable — <b>The furniture</b> was very expensive."},
{s:"e",t:"err",q:"Find the error: “Either Ram or his friends (a)/ has taken (b)/ my book (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"With “either…or”, verb agrees with the nearer subject — <b>have taken</b>."},
{s:"e",t:"err",q:"Find the error: “He insisted (a)/ on me to accompany (b)/ him there (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Insist on” takes a gerund — insisted on <b>my accompanying</b> him."},
{s:"e",t:"err",q:"Find the error: “The population of India (a)/ is greater (b)/ than China (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:2,x:"Faulty comparison — than <b>that of China</b>."},
{s:"e",t:"err",q:"Find the error: “Unless you do not work hard (a)/ you will not (b)/ succeed (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:0,x:"“Unless” already carries the negative — <b>Unless you work hard</b>."},
{s:"e",t:"err",q:"Find the error: “I have visited (a)/ the museum (b)/ yesterday (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:0,x:"With “yesterday” use simple past — <b>I visited</b> the museum yesterday."},
{s:"e",t:"err",q:"Find the error: “He is capable (a)/ to do (b)/ this work (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Capable” takes <b>of + -ing</b> — capable of doing."},
{s:"e",t:"err",q:"Find the error: “The news (a)/ are (b)/ shocking (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“News” is singular — <b>The news is</b> shocking."},
{s:"e",t:"err",q:"Find the error: “She has a good (a)/ command on (b)/ English (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"Fixed phrase — <b>command of</b> English."},
{s:"e",t:"err",q:"Find the error: “Both the sisters (a)/ love (b)/ one another (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:2,x:"For two people use <b>each other</b>; “one another” is for more than two."},
{s:"e",t:"err",q:"Find the error: “He asked me (a)/ that what (b)/ I was doing (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"Drop “that” — asked me <b>what</b> I was doing."},
{s:"e",t:"err",q:"Find the error: “The reason (a)/ of his failure (b)/ is because he was lazy (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:2,x:"“The reason…is <b>that</b> he was lazy” — never “because” after “the reason”."},
{s:"e",t:"err",q:"Find the error: “Many a student (a)/ have failed (b)/ in the test (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Many a” takes a singular verb — <b>has failed</b>."},
{s:"e",t:"err",q:"Find the error: “He congratulated (a)/ me for (b)/ my success (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Congratulate” takes <b>on</b> — congratulated me on my success."},
{s:"e",t:"err",q:"Find the error: “The train will arrive (a)/ on (b)/ 6 o'clock (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"Use <b>at</b> for exact time — at 6 o'clock."},
{s:"e",t:"err",q:"Find the error: “She is one of those girls (a)/ who is (b)/ very sincere (c)/ No error (d)”",o:["Part (a)","Part (b)","Part (c)","No error"],a:1,x:"“Who” refers to “girls” — <b>who are</b> very sincere."},
{s:"e",t:"fib",q:"She has been suffering from fever ______ last Monday.",o:["for","from","since","by"],a:2,x:"“Since” + point of time (last Monday)."},
{s:"e",t:"fib",q:"______ you work hard, you cannot succeed.",o:["Unless","If","Whether","Provided"],a:0,x:"“Unless you work hard” = if you do not work hard."},
{s:"e",t:"fib",q:"He is addicted ______ smoking.",o:["with","to","of","in"],a:1,x:"Fixed preposition — addicted <b>to</b>."},
{s:"e",t:"fib",q:"The meeting was presided ______ the chairman.",o:["by","over","with","at"],a:1,x:"“Preside <b>over</b>” a meeting."},
{s:"e",t:"fib",q:"I am grateful ______ you for your help.",o:["with","for","to","at"],a:2,x:"Grateful <b>to</b> a person, grateful <b>for</b> a thing."},
{s:"e",t:"fib",q:"______ of the two routes is shorter?",o:["Which","What","Whose","Whom"],a:0,x:"“Which” for a choice between two known items."},
{s:"e",t:"fib",q:"He is ______ honourable man.",o:["a","an","the","no article"],a:1,x:"“An” before a vowel <b>sound</b> — honourable starts with a vowel sound."},
{s:"e",t:"fib",q:"The thief ran away, but the police ran ______ him.",o:["after","behind","for","over"],a:0,x:"“Run <b>after</b>” = chase."},
{s:"e",t:"fib",q:"She abstained ______ voting in the election.",o:["from","of","to","in"],a:0,x:"Abstain <b>from</b> + -ing."},
{s:"e",t:"fib",q:"Hardly had I reached home ______ it started raining.",o:["than","when","then","that"],a:1,x:"“Hardly…<b>when</b>”."},
{s:"e",t:"fib",q:"He is blind ______ one eye.",o:["in","of","with","by"],a:1,x:"Blind <b>of</b> an eye; blind <b>to</b> faults."},
{s:"e",t:"fib",q:"The jury ______ divided in its opinion.",o:["was","were","is","has"],a:1,x:"Jury acting as individuals → plural verb <b>were</b>."},
{s:"e",t:"fib",q:"______ rich should help the poor.",o:["A","An","The","No article"],a:2,x:"“The rich” = rich people as a class."},
{s:"e",t:"fib",q:"She deals ______ cosmetics.",o:["with","in","on","at"],a:1,x:"Deal <b>in</b> goods; deal <b>with</b> a person."},
{s:"e",t:"fib",q:"He succeeded ______ his efforts.",o:["by","through","in spite","despite of"],a:1,x:"Succeeded <b>through</b> his efforts (by means of)."},
{s:"e",t:"fib",q:"I have no objection ______ your proposal.",o:["to","for","with","against"],a:0,x:"Objection <b>to</b> something."},
{s:"e",t:"fib",q:"The child was cured ______ the disease.",o:["from","of","off","with"],a:1,x:"Cured <b>of</b> a disease."},
{s:"e",t:"fib",q:"______ he is old, he works hard.",o:["Although","Despite","In spite","However"],a:0,x:"“Although” + clause; “despite” would need a noun phrase."},
{s:"e",t:"fib",q:"She is proficient ______ music.",o:["at","in","with","for"],a:1,x:"Proficient <b>in</b> something."},
{s:"e",t:"fib",q:"The train arrived ______ the platform an hour late.",o:["on","at","in","to"],a:1,x:"Arrive <b>at</b> a place (arrive <b>in</b> a country/city)."},
{s:"e",t:"fib",q:"He was accused ______ theft.",o:["with","of","for","by"],a:1,x:"Accused <b>of</b> a crime."},
{s:"e",t:"fib",q:"______ you like it or not, you must obey the rules.",o:["Whether","If","Unless","Though"],a:0,x:"“Whether…or not” for alternatives."},
{s:"e",t:"fib",q:"The manager is very popular ______ his staff.",o:["among","with","between","to"],a:1,x:"Popular <b>with</b> people."},
{s:"e",t:"fib",q:"He repented ______ his mistake.",o:["for","of","on","at"],a:1,x:"Repent <b>of</b> something."},
{s:"e",t:"fib",q:"There is no exception ______ this rule.",o:["for","to","of","in"],a:1,x:"Exception <b>to</b> a rule."},
{s:"e",t:"fib",q:"She takes pride ______ her work.",o:["of","in","on","at"],a:1,x:"Take pride <b>in</b> something."},
{s:"e",t:"fib",q:"The soldier fought ______ courage.",o:["with","by","for","of"],a:0,x:"Fought <b>with</b> courage (manner)."},
{s:"e",t:"fib",q:"He is eligible ______ the post.",o:["to","for","of","with"],a:1,x:"Eligible <b>for</b> a post."},
{s:"e",t:"fib",q:"The prices are rising ______ day.",o:["by","per","every","each"],a:1,x:"“Day <b>by</b> day” / prices rising <b>by</b> the day."},
{s:"e",t:"fib",q:"She is bent ______ mischief.",o:["on","upon","to","for"],a:1,x:"Bent <b>on</b> doing something."},
{s:"e",t:"syn",q:"Choose the synonym of EPHEMERAL.",o:["Eternal","Short-lived","Mysterious","Fragile"],a:1,x:"Ephemeral = lasting a very short time."},
{s:"e",t:"syn",q:"Choose the synonym of CANDID.",o:["Rude","Frank","Cunning","Timid"],a:1,x:"Candid = frank, outspoken."},

{s:"e",t:"nar",q:"Choose the correct indirect speech: He said, “Let us go for a walk.”",o:["He said that let us go for a walk.","He proposed that they should go for a walk.","He told that we should go.","He suggested to go for a walk."],a:1,x:"“Let us” → proposed/suggested that they should."},
{s:"e",t:"nar",q:"Choose the correct indirect speech: She said, “I was reading a novel yesterday.”",o:["She said that she was reading a novel the previous day.","She said that she had been reading a novel the previous day.","She told that she is reading a novel yesterday.","She said that I had been reading a novel yesterday."],a:1,x:"Past continuous → past perfect continuous; “yesterday” → “the previous day”."},
{s:"e",t:"pqrs",q:"P: The monsoon brings relief from the heat. Q: Farmers wait eagerly for its arrival. R: It usually sets in by early June. S: Sometimes it gets delayed by a week. Correct order:",o:["PQRS","QPRS","PRSQ","QRPS"],a:1,x:"Q (farmers wait) → P (it brings relief) → R (sets in June) → S (delay)."},
{s:"e",t:"pqrs",q:"P: He opened the old trunk carefully. Q: Inside lay letters tied with a ribbon. R: They were written by his grandfather. S: He read them till midnight. Correct order:",o:["PQRS","PRQS","QPRS","RPQS"],a:0,x:"P (opened trunk) → Q (inside lay letters) → R (written by grandfather) → S (read them)."},
{s:"e",t:"pqrs",q:"P: The train was already crowded. Q: We pushed our way inside. R: Luckily we found two seats. S: The journey began soon after. Correct order:",o:["PQRS","QPRS","PRQS","SPQR"],a:0,x:"P → Q → R → S follows the sequence of boarding."},
{s:"e",t:"pqrs",q:"P: Education shapes the character of a child. Q: It begins at home. R: Schools carry it forward. S: Society completes the process. Correct order:",o:["PQRS","QPRS","PRQS","SPQR"],a:0,x:"P (general) → Q (home) → R (schools) → S (society): widening circles."},
{s:"e",t:"pqrs",q:"P: The sun had just risen. Q: Birds were chirping in the trees. R: A cool breeze was blowing. S: It was a perfect morning. Correct order:",o:["PQRS","QPRS","SRQP","RSPQ"],a:0,x:"P → Q → R build the scene; S concludes with the summary line."},
{s:"e",t:"pqrs",q:"P: Discipline is the key to success. Q: It teaches punctuality and focus. R: Successful people swear by it. S: Without it talent goes waste. Correct order:",o:["PQRS","QSPR","PRSQ","SQPR"],a:0,x:"P (thesis) → Q (what it teaches) → R (examples) → S (warning)."},
{s:"e",t:"pqrs",q:"P: The library was silent and vast. Q: Rows of books lined the walls. R: I picked a novel at random. S: Hours passed unnoticed. Correct order:",o:["PQRS","QPRS","RPQS","SPQR"],a:0,x:"P (setting) → Q (detail) → R (action) → S (result)."},
{s:"e",t:"pqrs",q:"P: Honesty is the best policy. Q: A liar is never trusted. R: Truth may be bitter at first. S: But it always wins in the end. Correct order:",o:["PQRS","PRQS","QPRS","SPQR"],a:0,x:"P (maxim) → Q (contrast) → R–S (qualification + conclusion)."},
{s:"e",t:"pqrs",q:"P: The stadium roared as the match began. Q: India needed ten runs off the last over. R: The batsman hit a six on the first ball. S: The crowd erupted in joy. Correct order:",o:["QPRS","PQRS","PRQS","RQPS"],a:0,x:"Q (situation) → P (atmosphere) → R (action) → S (reaction)."},
{s:"e",t:"pqrs",q:"P: Water is precious. Q: Many regions face scarcity. R: We must avoid wastage. S: Every drop counts. Correct order:",o:["PQRS","QPRS","PSRQ","SRPQ"],a:0,x:"P (statement) → Q (problem) → R (solution) → S (slogan close)."},
{s:"e",t:"pqrs",q:"P: She woke up early that day. Q: The exam was at nine. R: She revised her notes quickly. S: She reached the centre on time. Correct order:",o:["PQRS","QPRS","PRQS","SQPR"],a:0,x:"P → Q (reason) → R (preparation) → S (outcome)."},
{s:"e",t:"pqrs",q:"P: Trees give us oxygen and shade. Q: They prevent soil erosion. R: Yet forests are being cut rapidly. S: We must plant more trees. Correct order:",o:["PQRS","PRQS","QPRS","SPQR"],a:0,x:"P–Q (benefits) → R (problem) → S (call to action)."},
{s:"g",t:"pol",q:"Which Article of the Indian Constitution deals with the Right to Equality?",o:["Article 14","Article 19","Article 21","Article 32"],a:0,x:"Articles <b>14–18</b> cover the Right to Equality."},

/* ================= QUIZ ENGINE ================= */
const TOPIC = {err:"Error Spotting",fib:"Fill in the Blank",syn:"Synonym",ant:"Antonym",idm:"Idiom & Phrase",
  ows:"One-Word Substitution",voi:"Voice",nar:"Narration",pqrs:"Para Jumble",
  pol:"Polity",his:"History",geo:"Geography",eco:"Economy",sci:"Science",gk:"Static GK"};
const $ = id => document.getElementById(id);
const qText=$("qText"), optsEl=$("opts"), whyEl=$("why"), btnNext=$("btnNext"), btnSkip=$("btnSkip");
const tSub=$("tSub"), tTop=$("tTop"), tQno=$("tQno"), toast=$("toast");

let filter="all", pool=[], pos=0, answered=false, correctIdx=0, qCount=0;
let stats={att:0, ok:0, streak:0, best:+(localStorage.getItem("cglBest")||0)};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toastMsg(m){toast.textContent=m;toast.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove("show"),2200);}
function buildPool(){pool=shuffle(QUESTIONS.filter(q=>filter==="all"||q.s===filter));pos=0;}

function paintStats(){
  $("sAtt").textContent=stats.att;
  $("sOk").textContent=stats.ok;
  $("sAcc").textContent=stats.att?Math.round(stats.ok/stats.att*100)+"%":"–";
  $("sBank").textContent=QUESTIONS.length;
  $("bankNote").textContent=QUESTIONS.length+" questions in bank";
  $("streak").textContent="🔥 "+stats.streak;
}

function render(){
  if(pos>=pool.length){buildPool();toastMsg("🔁 Bank reshuffled — fresh questions, keep going!");}
  answered=false;
  const q=pool[pos]; qCount++;
  const isEng=q.s==="e";
  tSub.textContent=isEng?"ENGLISH":"GENERAL AWARENESS";
  tSub.className="tag "+(isEng?"eng":"ga");
  tTop.textContent=TOPIC[q.t]||q.t;
  tQno.textContent="Q "+qCount;
  qText.textContent=q.q;
  const order=shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));
  correctIdx=order.findIndex(o=>o.ok);
  optsEl.innerHTML="";
  order.forEach((o,i)=>{
    const b=document.createElement("button");
    b.className="opt"; b.innerHTML='<span class="k">'+String.fromCharCode(65+i)+'</span><span></span>';
    b.lastChild.textContent=o.t;
    b.onclick=()=>answer(i,b);
    optsEl.appendChild(b);
  });
  whyEl.className="why"; whyEl.innerHTML="";
  btnNext.classList.remove("show");
}

function reveal(pick){
  const btns=[...optsEl.children];
  btns.forEach((b,i)=>{
    b.classList.add("lock");
    if(i===correctIdx)b.classList.add("right");
    else if(i===pick)b.classList.add("wrong");
    else b.classList.add("dim");
  });
  whyEl.innerHTML="<b>💡 Why:</b> "+pool[pos].x;
  whyEl.classList.add("show");
  btnNext.classList.add("show");
}

function answer(i){
  if(answered)return; answered=true;
  stats.att++;
  const good=(i===correctIdx);
  if(good){stats.ok++;stats.streak++;if(stats.streak>stats.best){stats.best=stats.streak;localStorage.setItem("cglBest",stats.best);}}
  else stats.streak=0;
  reveal(i); paintStats();
  if(stats.att%25===0)toastMsg("⚡ "+stats.att+" attempted • "+Math.round(stats.ok/stats.att*100)+"% accuracy");
}

btnNext.onclick=()=>{pos++;render();};
btnSkip.onclick=()=>{if(answered)return;answered=true;stats.att++;stats.streak=0;reveal(-1);paintStats();};

document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  c.classList.add("on"); filter=c.dataset.f; buildPool(); render();
});

document.addEventListener("keydown",e=>{
  if(e.key>="1"&&e.key<="4"){const b=optsEl.children[+e.key-1];if(b&&!answered)b.click();}
  else if(e.key==="Enter"&&answered){pos++;render();}
  else if((e.key==="s"||e.key==="S")&&!answered)btnSkip.click();
});

buildPool(); render(); paintStats();
</script>
</body>
</html>
